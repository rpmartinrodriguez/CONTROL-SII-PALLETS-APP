<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SII PALLETS APP</title>
    
    <meta name="theme-color" content="#013b85">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SII PALLETS">
    <link rel="apple-touch-icon" href="/app-icon-180.png">
    <link rel="icon" type="image/png" href="/app-icon-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <div id="root"></div>
    
    <script type="module" src="/src/main.jsx"></script>
    
    <script>
      // Detecta cada nuevo despliegue de Netlify sin cerrar la PWA.
      // No recarga formularios en uso: ofrece confirmar la actualización.
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', async () => {
          let registration;
          let currentVersion = '';
          let refreshing = false;
          let updateNotice;
          const showUpdate = () => {
            if (updateNotice) return;
            updateNotice = document.createElement('div');
            updateNotice.setAttribute('role','status');
            updateNotice.style.cssText = 'position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:10000;background:#132b4e;color:white;padding:12px 16px;border-radius:14px;box-shadow:0 8px 28px #0005;display:flex;align-items:center;gap:12px;font:600 13px system-ui;max-width:calc(100vw - 24px)';
            const label = document.createElement('span');
            label.textContent = 'Actualización disponible. Guardá o cancelá el formulario antes de actualizar.';
            const button = document.createElement('button');
            button.textContent = 'Actualizar ahora';
            button.style.cssText = 'background:#fff;color:#132b4e;border:0;border-radius:9px;padding:9px 12px;font-weight:800;white-space:nowrap';
            button.addEventListener('click',()=>location.reload());
            updateNotice.append(label,button);
            document.body.appendChild(updateNotice);
          };
          const safeToRefresh = () => {
            const active=document.activeElement;
            const typing=active && active.matches && active.matches('input,textarea,select,[contenteditable="true"]');
            return !window.__siiBudgetDraftDirty && !typing;
          };
          const refresh = () => {
            if(refreshing) return;
            if(!safeToRefresh()){showUpdate();return;}
            refreshing=true;
            location.reload();
          };
          try {
            registration = await navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'});
            navigator.serviceWorker.addEventListener('controllerchange',refresh);
          } catch (error) { console.warn('PWA: registro de actualización no disponible',error); }
          const checkVersion=async()=>{
            if(document.visibilityState==='hidden'||!navigator.onLine)return;
            try{
              const response=await fetch('/version.json',{cache:'no-store'});
              if(!response.ok)return;
              const data=await response.json();
              if(!data.version)return;
              if(!currentVersion){currentVersion=data.version;return;}
              if(data.version!==currentVersion){
                if(registration) await registration.update().catch(()=>{});
                // El worker puede estar instalado pero una edición impide reiniciar.
                refresh();
              }
            }catch(error){console.warn('PWA: revisión de versión pendiente',error);}
          };
          await checkVersion();
          setInterval(checkVersion,60000);
          document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')void checkVersion();});
          window.addEventListener('online',()=>void checkVersion());
        });
      }
    </script>
</body>
</html>
